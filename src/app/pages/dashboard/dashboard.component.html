<section class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-6">
        <div class="card card-warning h-100">
          <div class="card-header">
            <h3 class="card-title">Faire une demande</h3>
          </div>
          <div class="card-body">
            <p class="card-text">Créez une demande de bordereau</p>
            <button class="btn btn-warning" (click)="openDemandeModal()">Créer une demande</button>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card card-success h-100">
          <div class="card-header">
            <h3 class="card-title">Fournir un bordereau</h3>
          </div>
          <div class="card-body">
            <p class="card-text">Fournissez un bordereau</p>
            <a class="btn btn-success" routerLink="/bordereau">Fournir un bordereau</a>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Demandes</h3>
          </div>
          <div class="card-body">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Numéro de la demande</th>
                  <th>Date de la demande</th>
                  <th>Statut</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let demande of demandes">
                  <td>{{ demande.numero }}</td>
                  <td>{{ demande.date }}</td>
                  <td [ngClass]="demande.statut | statusColor">
                    {{ demande.statut }}
                  </td>
                  <td>
                    <button class="btn btn-sm btn-success" *ngIf="demande.statut === 'validé'" (click)="downloadBordereau(demande.id)">Télécharger le bordereau</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal de sélection du type de demande -->
  <ng-template #demandeModal let-modal>
    <div class="modal-header">
      <h4 class="modal-title">Sélectionnez le type de demande</h4>
      <button type="button" class="close" aria-label="Close" (click)="modal.dismiss()">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="modal-body text-center">
      <button class="btn btn-primary btn-lg m-2" (click)="selectDemandeType('physique')">
        <i class="fas fa-user me-2"></i>Personne Physique
      </button>
      <button class="btn btn-success btn-lg m-2" (click)="selectDemandeType('morale')">
        <i class="fas fa-building me-2"></i>Personne Morale
      </button>
    </div>
  </ng-template>
</section>
