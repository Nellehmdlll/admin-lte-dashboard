<div class="container mt-4">
  <h3>Inscription</h3>
  <form (ngSubmit)="register()" #registerForm="ngForm">

    <div class="form-group mb-3">
      <label for="civilite">Civilité</label>
      <select id="civilite" class="form-control" [(ngModel)]="form.civilite" name="civilite" required>
        <option value="" disabled selected>Choisir...</option>
        <option value="M.">M.</option>
        <option value="Mme">Mme</option>
      </select>
    </div>

    <div class="form-group mb-3">
      <label for="nom">Nom</label>
      <input id="nom" type="text" class="form-control" [(ngModel)]="form.nom" name="nom" required>
    </div>

    <div class="form-group mb-3">
      <label for="prenom">Prénom</label>
      <input id="prenom" type="text" class="form-control" [(ngModel)]="form.prenom" name="prenom" required>
    </div>

    <div class="form-group mb-3">
      <label for="date_naissance">Date de naissance</label>
      <input id="date_naissance" type="date" class="form-control" [(ngModel)]="form.date_naissance" name="date_naissance" required>
    </div>

    <div class="form-group mb-3">
      <label for="numero_nip">Numéro NIP</label>
      <input id="numero_nip" type="text" class="form-control" [(ngModel)]="form.numero_nip" name="numero_nip" required>
    </div>

    <div class="form-group mb-3">
      <label for="profession">Profession</label>
      <input id="profession" type="text" class="form-control" [(ngModel)]="form.profession" name="profession" required>
    </div>

    <div class="form-group mb-3">
      <label for="email">Email</label>
      <input id="email" type="email" class="form-control" [(ngModel)]="form.email" name="email" required>
    </div>

    <div class="form-group mb-4">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" class="form-control" [(ngModel)]="form.password" name="password" minlength="6" required>
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="registerForm.invalid">S'inscrire</button>
  </form>
</div>
