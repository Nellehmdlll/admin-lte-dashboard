<div class="auth-container">
  <h2>Inscription</h2>

  <form (ngSubmit)="register()" #registerForm="ngForm">
    <div class="mb-3">
      <label>Nom</label>
      <input [(ngModel)]="formData.nom" name="nom" class="form-control" required />
    </div>

    <div class="mb-3">
      <label>Prénom</label>
      <input [(ngModel)]="formData.prenom" name="prenom" class="form-control" required />
    </div>

    <div class="mb-3">
      <label>Civilité</label>
      <select [(ngModel)]="formData.civilite" name="civilite" class="form-control" required>
        <option value="">-- Choisir --</option>
        <option value="M">Monsieur</option>
        <option value="F">Madame</option>
      </select>
    </div>

    <div class="mb-3">
      <label>Date de naissance</label>
      <input type="date" [(ngModel)]="formData.date_naissance" name="date_naissance" class="form-control" required />
    </div>

    <div class="mb-3">
      <label>Numéro NIP</label>
      <input [(ngModel)]="formData.numero_nip" name="numero_nip" class="form-control" required />
    </div>

    <div class="mb-3">
      <label>Profession</label>
      <input [(ngModel)]="formData.profession" name="profession" class="form-control" required />
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input [(ngModel)]="formData.email" name="email" class="form-control" type="email" required />
    </div>

    <div class="mb-3">
      <label>Mot de passe</label>
      <input [(ngModel)]="formData.password" name="password" class="form-control" type="password" required />
    </div>

    <button type="submit" class="btn btn-success">S'inscrire</button>

    <div class="switch-link mt-2">
      <button type="button" class="btn btn-link p-0" (click)="goToLogin()">Déjà inscrit ? Connexion</button>
    </div>
  </form>
</div>
