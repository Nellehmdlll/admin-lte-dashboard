<div class="auth-container">
  <h2>Connexion</h2>

  <form (ngSubmit)="login()" #loginForm="ngForm">
    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Adresse email</label>
      <input
        [(ngModel)]="email"
        name="email"
        id="email"
        type="email"
        class="form-control"
        placeholder="ex: exemple@mail.com"
        required
      />
    </div>

    <!-- Mot de passe -->
    <div class="mb-3">
      <label for="password" class="form-label">Mot de passe</label>
      <input
        [(ngModel)]="password"
        name="password"
        id="password"
        type="password"
        class="form-control"
        placeholder="••••••••"
        required
      />
    </div>

    <!-- Bouton de connexion -->
    <button type="submit" class="btn btn-primary" [disabled]="!loginForm.form.valid">
      Se connecter
    </button>

    <!-- Lien vers register -->
    <div class="switch-link">
      <button type="button" class="btn btn-link p-0" (click)="goToRegister()">
            Pas encore inscrit ? Créez un compte
      </button>

    </div>
  </form>
</div>
