<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">
      <i class="fas fa-user-shield me-2"></i>Super Dashboard – Gestion des rôles
    </h2>
    <input
      type="text"
      class="form-control w-25"
      placeholder="🔍 Rechercher un utilisateur"
      [(ngModel)]="search"
    />
  </div>

  <div class="card card-primary card-outline">
    <div class="card-body table-responsive p-0">
      <table class="table table-hover text-nowrap align-middle">
        <thead class="bg-primary text-white">
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Rôle actuel</th>
            <th>Modifier le rôle</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of filteredUsers()">
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>
              <span class="badge bg-info">{{ user.roles[0] }}</span>
            </td>
            <td>
              <select class="form-select" [(ngModel)]="user.selectedRole" (change)="updateRole(user)">
                <option *ngFor="let role of allRoles" [value]="role">{{ role }}</option>
              </select>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
