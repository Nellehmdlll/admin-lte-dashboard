<div class="container mt-5">
  <h3>Détails de la demande</h3>

  <div *ngIf="demandeDetails; else notFound">
    <p><strong>ID :</strong> {{ demandeDetails.id }}</p>
    <p><strong>Nom :</strong> {{ demandeDetails.nom }}</p>
    <p><strong>Date :</strong> {{ demandeDetails.date }}</p>
    <p><strong>Statut :</strong> {{ demandeDetails.statut }}</p>
    <p><strong>Commentaire :</strong> {{ demandeDetails.commentaire }}</p>
  </div>

  <ng-template #notFound>
    <div class="alert alert-danger">
      Demande introuvable.
    </div>
  </ng-template>
</div>
